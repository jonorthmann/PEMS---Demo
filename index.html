<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEMS · Evidence Training Simulator</title>
<style>
:root{font:16px system-ui,sans-serif;color:#13243a;background:#eef2f5;--navy:#102139;--ink:#13243a;--muted:#4e6075;--line:#d9e1e8;--teal:#006b65}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #008f83;outline-offset:3px}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:white;padding:30px 18px;display:flex;flex-direction:column;gap:34px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #5c8b94;border-radius:10px;background:#193b4a;color:#96e3d7;font-weight:800;flex:none}.brand strong{display:block;font-size:1.35rem;letter-spacing:.09em}.brand small{display:block;color:#b2c3d6;font-size:.76rem}
nav{display:grid;gap:6px}nav button{border:0;border-left:3px solid transparent;border-radius:5px;text-align:left;background:none;color:#d5e0ed;padding:12px 10px;font-size:.91rem}nav button:hover,nav button[aria-current=page]{border-left-color:#7fe1ce;background:#233a52;color:white}
.aside-case{margin-top:auto;border-top:1px solid #34465d;padding:18px 8px 0;color:#c4d3e3;font-size:.85rem}.aside-case strong{display:block;color:white;margin-top:5px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(18px,4vw,52px);background:white;border-bottom:1px solid var(--line)}.review{color:#155950;background:#e1f4ef;border-radius:4px;padding:7px 10px;font-size:.83rem;font-weight:700}
main{padding:32px clamp(18px,4vw,52px) 50px;max-width:1380px;margin:auto}h1{font-size:clamp(1.85rem,4vw,2.6rem);letter-spacing:-.045em;margin:0 0 8px}h2{font-size:1.16rem;margin:0 0 12px}p{line-height:1.55;margin:0 0 12px}.muted{color:var(--muted)}.intro{margin-bottom:24px}.hero{background:#172d47;border-radius:12px;padding:26px;color:white;margin-bottom:18px;border-left:4px solid #72cbbc}.hero p{color:#d8e5f1;max-width:710px}.case-id{font:700 .8rem ui-monospace,monospace;letter-spacing:.12em;color:#93e2d5;margin-bottom:12px}.hero h2{font-size:1.65rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);padding:20px;border-radius:10px}.card p:last-child{margin-bottom:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 16px}
.btn{background:white;color:var(--ink);border:1px solid #b4c4d1;border-radius:6px;padding:8px 12px;font-weight:650;font-size:.875rem}.btn:hover{background:#e9f3f4}.primary,.btn[aria-pressed=true]{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover,.btn[aria-pressed=true]:hover{background:#005650}.pill{display:inline-block;background:#e8eff6;color:#314c67;padding:4px 8px;border-radius:4px;font-size:.82rem;font-weight:650}.record{background:white;border:1px solid var(--line);border-radius:9px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}caption{text-align:left;font-weight:750;padding:16px}th,td{text-align:left;padding:12px 16px;border-top:1px solid var(--line)}th{color:#40546c;background:#f6f8fa;font-size:.85rem}td{font-size:.92rem}.empty{text-align:center;padding:30px 20px}.empty p{margin-bottom:0}dl{margin:0;display:grid;gap:12px}dt{font-size:.82rem;color:var(--muted)}dd{margin:3px 0 0;font-weight:650}
dialog{width:min(480px,calc(100% - 30px));border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink)}dialog::backdrop{background:#0d2039aa}dialog dl{margin-bottom:20px}
@media(max-width:850px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.shell{display:block}aside{gap:16px;padding:16px}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}nav button{padding:8px}.aside-case{display:none}}
@media(max-width:440px){.grid,.grid.three{grid-template-columns:1fr}}

label{display:grid;gap:5px;font-weight:650}input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid #b4c4d1;border-radius:5px;color:inherit;background:white}textarea{min-height:85px}.fields{display:grid;gap:14px;margin-bottom:18px}dialog{max-height:90vh;overflow:auto}video{width:100%;max-height:55vh;margin-bottom:12px}.entry{margin-bottom:16px;max-width:740px}.entry .fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));align-items:start}.entry textarea{min-height:76px}.casebar{margin-bottom:24px}.casebar p{margin:0}.error{color:#a42525}td button{white-space:nowrap}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.intro h1{margin:0}form .toolbar{margin-bottom:0}
</style>
</head>
<body>
<div class="shell">
<aside>
<div class="brand"><span class="mark" aria-hidden="true">PE</span><div><strong>PEMS</strong><small>Police Evidence Management System</small></div></div>
<nav aria-label="Case records" id="nav"></nav>
</aside>
<div>
<header><strong>Case TR-2026-014</strong><span class="review">Training prototype</span></header>
<main>
<section class="card casebar" aria-label="Case details">
<p><strong>Office theft and assault</strong> · <span class="pill">Open</span></p>
<p class="muted">Administrative office, Room 204</p>
</section>
<p id="notice" role="status" hidden></p>
<section id="screen"></section>
</main>
</div>
</div>
<dialog id="editor" aria-labelledby="dialog-title">
<h2 id="dialog-title"></h2>
<div id="dialog-body"></div>
</dialog>
<script>
const screens={
  exhibit:{title:'Evidence Register',action:'Add exhibit',empty:'No exhibits recorded',
    columns:['Reference','Description','Type','Found at','Current custody']},
  video:{title:'Video Recordings',action:'Upload video',empty:'No videos attached',
    columns:['Recording','Exhibit','File','Recorded by']},
  request:{title:'Specialist Coordination',action:'Log contact',empty:'No specialist contacts recorded',
    columns:['Exhibit','Unit contacted','Purpose of contact','Contact time','Recorded by']},
  transfer:{title:'Custody History',action:'Record transfer',empty:'No transfers recorded',
    columns:['Exhibit','Released by','Received by','Destination','Transfer time','Recorded by']}
};
const nav=document.querySelector('#nav'),screen=document.querySelector('#screen');
const dialog=document.querySelector('#editor'),body=document.querySelector('#dialog-body');
const notice=document.querySelector('#notice');
let active='exhibit',records=[],ready=false,objectUrl,renderVersion=0;
const database=new Promise((resolve,reject)=>{
  const request=indexedDB.open('pems-training-case-TR-2026-014',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('records',{keyPath:'id',autoIncrement:true});
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
});
async function transact(mode,operation){
  const db=await database;
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('records',mode);
    const request=operation(tx.objectStore('records'));
    tx.oncomplete=()=>resolve(request.result);
    tx.onabort=()=>reject(tx.error);
  });
}
const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const timestamp=value=>value?new Date(value).toLocaleString():'';
const exhibits=()=>records.filter(record=>record.kind==='exhibit');
const ref=id=>id?'EX-'+String(id).padStart(3,'0'):'Case';
const custody=id=>records.filter(r=>r.kind==='transfer'&&r.exhibit===id).sort((a,b)=>b.time.localeCompare(a.time)||b.id-a.id)[0];
const button=(label,attribute,value='',primary=false)=>`<button type="button" class="btn ${primary?'primary':''}" data-${attribute}="${escape(value)}">${escape(label)}</button>`;
const message=(text,error=false)=>{
  notice.hidden=!text;
  notice.textContent=text;
  notice.classList.toggle('error',error);
};
function row(r){
  switch(r.kind){
    case 'exhibit':{
      const latest=custody(r.id);
      return [button(ref(r.id),'detail',r.id),escape(r.description),escape(r.type),escape(r.location),escape(latest?latest.to+' · '+latest.destination:r.officer)];
    }
    case 'video':return [button(r.description,'play',r.id),ref(r.exhibit),escape(r.file.name),escape(r.officer)];
    case 'request':return [button(ref(r.exhibit),'detail',r.exhibit),escape(r.specialism),button(r.description,'contact',r.id),escape(timestamp(r.time)),escape(r.officer)];
    case 'transfer':return [button(ref(r.exhibit),'detail',r.exhibit),escape(r.from),escape(r.to),escape(r.destination),escape(timestamp(r.time)),escape(r.officer||r.from)];
  }
}
function render(){
  const current=screens[active];
  nav.innerHTML=Object.entries(screens).map(([key,value])=>`<button type="button" data-nav="${key}" ${key===active?'aria-current="page"':''}>${value.title}</button>`).join('');
  const rows=records.filter(r=>r.kind===active).map(row);
  screen.innerHTML=`<div class="intro"><h1>${current.title}</h1>${ready&&rows.length?button(current.action,'add',active,true):''}</div>`+
    (ready&&!rows.length?
      `<section class="card entry"><h2>${current.action}</h2>${recordForm(active)}</section>`:'')+
    (rows.length?`<div class="record"><table aria-label="${current.title}"><thead><tr>${current.columns.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:
    `<div class="card empty">${ready?current.empty:'Records are unavailable'}</div>`);
}
function open(title,markup){
  document.querySelector('#dialog-title').textContent=title;
  body.innerHTML=markup;
  if(!dialog.open)dialog.showModal();
  body.querySelector('input, select, textarea, button')?.focus();
}
const input=(label,name,type='text',value='')=>`<label>${label}<input name="${name}" type="${type}" value="${escape(value)}" required></label>`;
const notes=(label,name,required=false)=>`<label>${label}<textarea name="${name}" ${required?'required':''}></textarea></label>`;
const select=(label,name,options)=>`<label>${label}<select name="${name}" required><option value="">Select</option>${options.map(([value,text])=>`<option value="${escape(value)}">${escape(text)}</option>`).join('')}</select></label>`;
const fields=(kind,id)=>{
  const officer=input('Recorded by','officer');
  const options=exhibits().map(r=>[r.id,ref(r.id)+' · '+r.description]);
  const linked=id?`<input type="hidden" name="exhibit" value="${id}"><p><strong>Exhibit</strong> ${ref(id)}</p>`:
    select(kind==='video'?'Link to':'Exhibit','exhibit',kind==='video'?[['case','Case TR-2026-014'],...options]:options);
  switch(kind){
    case 'exhibit':return input('Description','description')+select('Evidence type','type',['Biological','Digital','Trace','Physical','Other'].map(type=>[type,type]))+
      input('Location found','location')+input('Collection date and time','time','datetime-local')+officer+input('Package or seal reference','seal')+notes('Notes','notes');
    case 'video':return linked+input('Recording title','description')+officer+'<label>Video file<input name="file" type="file" accept="video/*,.mp4,.webm,.mov" required></label>'+
      '<p class="muted">Videos are saved in this browser profile.</p>';
    case 'request':return linked+input('Unit contacted','specialism')+input('Person contacted','person')+
      input('Contact date and time','time','datetime-local')+notes('Purpose of contact','description',true)+
      notes('Advice or instructions received (if any)','advice')+notes('Agreed follow-up actions (if any)','followup')+officer;
    case 'transfer':return linked+input('Released by','from','text',id?(custody(id)?.to??exhibits().find(r=>r.id===id)?.officer):'')+
      input('Received by','to')+input('Destination','destination')+input('Transfer date and time','time','datetime-local')+officer+notes('Handover notes','notes');
  }
};
function recordForm(kind,id,modal=false){
  const needsExhibit=(kind==='request'||kind==='transfer')&&!exhibits().length;
  const guidance=needsExhibit?`<p class="muted">Save an exhibit in the Evidence Register before saving this record.</p>`:'';
  return `<form data-kind="${kind}">${guidance}<div class="fields">${fields(kind,id)}</div><p class="error" role="alert" hidden></p>
    <div class="toolbar"><button class="btn primary" type="submit" ${needsExhibit?'disabled':''}>${kind==='video'?'Save video':'Save record'}</button>${modal?button('Cancel','close'):''}</div></form>`;
}
function edit(kind,id){
  if((kind==='request'||kind==='transfer')&&!exhibits().length){
    message('Add an exhibit before logging specialist contact or recording a transfer.');
    return;
  }
  open(screens[kind].action,recordForm(kind,id,true));
}
function showExhibit(id){
  const r=exhibits().find(item=>item.id===id);
  const latest=custody(id);
  const values=[['Evidence type',r.type],['Location found',r.location],['Collected at',timestamp(r.time)],['Recorded by',r.officer],
    ['Package or seal reference',r.seal],['Current custody',latest?latest.to+' · '+latest.destination:r.officer],['Notes',r.notes]];
  open(ref(id)+' · '+r.description,`<dl>${values.filter(([,value])=>value).map(([label,value])=>`<div><dt>${label}</dt><dd>${escape(value)}</dd></div>`).join('')}</dl>
    <div class="toolbar">${button('Upload video','linked','video:'+id)}${button('Log specialist contact','linked','request:'+id)}${button('Record transfer','linked','transfer:'+id)}${button('Close','close')}</div>`);
}
function showContact(id){
  const r=records.find(item=>item.id===id);
  const values=[['Exhibit',ref(r.exhibit)],['Unit contacted',r.specialism],['Person contacted',r.person],
    ['Contact time',timestamp(r.time)],['Purpose of contact',r.description],['Advice or instructions received',r.advice],
    ['Agreed follow-up actions',r.followup],['Recorded by',r.officer]];
  open('Specialist contact',`<dl>${values.filter(([,value])=>value).map(([label,value])=>`<div><dt>${label}</dt><dd>${escape(value)}</dd></div>`).join('')}</dl>${button('Close','close')}`);
}
document.addEventListener('click',event=>{
  const b=event.target.closest('button');
  if(!b)return;
  const d=b.dataset;
  if(d.nav){active=d.nav;message('');render();nav.querySelector('[aria-current]').focus();}
  if(d.add)edit(d.add);
  if(d.detail)showExhibit(Number(d.detail));
  if(d.contact)showContact(Number(d.contact));
  if(d.linked){const [kind,id]=d.linked.split(':');edit(kind,Number(id));}
  if(d.play){
    const r=records.find(item=>item.id===Number(d.play));
    objectUrl=URL.createObjectURL(r.file);
    open(r.description,`<video controls preload="metadata" src="${objectUrl}"></video><p class="muted">${escape(r.file.name)} · ${ref(r.exhibit)}</p>
      <a href="${objectUrl}" download="${escape(r.file.name)}">Download video</a> ${button('Close','close')}`);
  }
  if('close' in d&&!dialog.querySelector('[type=submit]:disabled'))dialog.close();
});
dialog.addEventListener('cancel',event=>{
  if(dialog.querySelector('[type=submit]:disabled'))event.preventDefault();
});
dialog.addEventListener('close',()=>{
  if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=undefined;}
  if(!dialog.open)body.replaceChildren();
});
document.addEventListener('submit',async event=>{
  const form=event.target;
  if(!form.dataset.kind)return;
  event.preventDefault();
  const save=form.querySelector('[type=submit]'),error=form.querySelector('[role=alert]');
  if(save.disabled)return;
  const entry=Object.fromEntries(new FormData(form));
  for(const key of Object.keys(entry)){
    if(typeof entry[key]==='string')entry[key]=entry[key].trim();
  }
  if([...form.querySelectorAll('[required]')].some(field=>entry[field.name]==='')){
    error.textContent='Complete all required fields.';error.hidden=false;return;
  }
  if(entry.file&&(!entry.file.size||!(entry.file.type.startsWith('video/')||(!entry.file.type&&/\.(mp4|webm|mov)$/i.test(entry.file.name))))){
    error.textContent='Choose a video file.';error.hidden=false;return;
  }
  entry.kind=form.dataset.kind;
  entry.recordedAt=new Date().toISOString();
  if(entry.exhibit)entry.exhibit=entry.exhibit==='case'?null:Number(entry.exhibit);
  if((entry.kind==='request'||entry.kind==='transfer')&&!exhibits().some(exhibit=>exhibit.id===entry.exhibit)){
    error.textContent='Select a saved exhibit.';error.hidden=false;return;
  }
  save.disabled=true;
  try{
    await transact('readwrite',store=>store.add(entry));
  }catch{
    error.textContent='The record could not be saved. Check available browser storage and try again.';
    error.hidden=false;save.disabled=false;return;
  }
  if(dialog.contains(form))dialog.close();
  active=entry.kind;
  await refresh();
  if(ready){message('Record saved.');screen.querySelector('[data-add]')?.focus();}
});
async function refresh(){
  const version=++renderVersion;
  try{
    const all=await transact('readonly',store=>store.getAll());
    if(version!==renderVersion)return;
    records=all;ready=true;render();
  }catch{
    if(version!==renderVersion)return;
    ready=false;render();message('Browser storage is unavailable. Open the simulator in a browser tab with local storage enabled.',true);
  }
}
window.addEventListener('focus',()=>{
  if(!dialog.open&&!screen.querySelector('form'))refresh();
});
refresh();
</script>
</body>
</html>
