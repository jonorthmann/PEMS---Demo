<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEMS · Evidence Training Simulator</title>
<style>
:root{font:16px system-ui,sans-serif;color:#13243a;background:#eef2f5;--navy:#102139;--ink:#13243a;--muted:#4e6075;--line:#d9e1e8;--teal:#006b65}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #008f83;outline-offset:3px}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:white;padding:30px 18px;display:flex;flex-direction:column;gap:34px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #5c8b94;border-radius:10px;background:#193b4a;color:#96e3d7;font-weight:800;flex:none}.brand strong{display:block;font-size:1.35rem;letter-spacing:.09em}.brand small{display:block;color:#b2c3d6;font-size:.76rem}
nav{display:grid;gap:6px}nav button{border:0;border-left:3px solid transparent;border-radius:5px;text-align:left;background:none;color:#d5e0ed;padding:12px 10px;font-size:.91rem}nav button:hover,nav button[aria-current=page]{border-left-color:#7fe1ce;background:#233a52;color:white}
.aside-case{margin-top:auto;border-top:1px solid #34465d;padding:18px 8px 0;color:#c4d3e3;font-size:.85rem}.aside-case strong{display:block;color:white;margin-top:5px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(18px,4vw,52px);background:white;border-bottom:1px solid var(--line)}.review{color:#155950;background:#e1f4ef;border-radius:4px;padding:7px 10px;font-size:.83rem;font-weight:700}
main{padding:32px clamp(18px,4vw,52px) 50px;max-width:1380px;margin:auto}h1{font-size:clamp(1.85rem,4vw,2.6rem);letter-spacing:-.045em;margin:0 0 8px}h2{font-size:1.16rem;margin:0 0 12px}p{line-height:1.55;margin:0 0 12px}.muted{color:var(--muted)}.intro{margin-bottom:24px}.hero{background:#172d47;border-radius:12px;padding:26px;color:white;margin-bottom:18px;border-left:4px solid #72cbbc}.hero p{color:#d8e5f1;max-width:710px}.case-id{font:700 .8rem ui-monospace,monospace;letter-spacing:.12em;color:#93e2d5;margin-bottom:12px}.hero h2{font-size:1.65rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);padding:20px;border-radius:10px}.card p:last-child{margin-bottom:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 16px}
.btn{background:white;color:var(--ink);border:1px solid #b4c4d1;border-radius:6px;padding:8px 12px;font-weight:650;font-size:.875rem}.btn:hover{background:#e9f3f4}.primary,.btn[aria-pressed=true]{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover,.btn[aria-pressed=true]:hover{background:#005650}.pill{display:inline-block;background:#e8eff6;color:#314c67;padding:4px 8px;border-radius:4px;font-size:.82rem;font-weight:650}.record{background:white;border:1px solid var(--line);border-radius:9px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}caption{text-align:left;font-weight:750;padding:16px}th,td{text-align:left;padding:12px 16px;border-top:1px solid var(--line)}th{color:#40546c;background:#f6f8fa;font-size:.85rem}td{font-size:.92rem}.empty{text-align:center;padding:30px 20px}.empty p{margin-bottom:0}dl{margin:0;display:grid;gap:12px}dt{font-size:.82rem;color:var(--muted)}dd{margin:3px 0 0;font-weight:650}
dialog{width:min(480px,calc(100% - 30px));border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink)}dialog::backdrop{background:#0d2039aa}dialog dl{margin-bottom:20px}
@media(max-width:850px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.shell{display:block}aside{gap:16px;padding:16px}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}nav button{padding:8px}.aside-case{display:none}}
@media(max-width:440px){.grid,.grid.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside><div class="brand"><span class="mark" aria-hidden="true">PE</span><div><strong>PEMS</strong><small>Police Evidence Management System</small></div></div>
<nav aria-label="Simulator screens" id="nav"></nav>
<div class="aside-case">Training case<strong>TR-2026-014</strong></div></aside>
<div><header><span class="review">Proof of Concept — For Trainer Review</span><button class="btn primary" id="samples">Load sample records</button></header>
<main id="screen" tabindex="-1"></main></div>
</div>
<dialog id="detail"><h2 id="detail-title"></h2><dl id="detail-body"></dl><form method="dialog"><button class="btn">Close</button></form></dialog>
<script>
const names=['Case Overview','Recording Equipment','Evidence Register','Specialist Coordination','Evidence Transfer','Assessor Dashboard'];
const descriptions=[
  'Review the case brief before starting the practical exercise.',
  'Review the kit available for documenting the scene and tracking exhibits.',
  'Review the exhibits logged against this case.',
  'Review requests linked to exhibits and the questions sent to specialists.',
  'Review the recorded handover of exhibits between the scene team and evidence intake.',
  'Review the evidence trail and discuss what the learner would need to demonstrate in practice.'
];
const items=[
  ['EX-01','Drinking bottle','Biological','Desk beside the entrance','Specialist review requested'],
  ['EX-02','Loose fibres','Trace','Visitor chair','Specialist review requested'],
  ['EX-03','Broken glass','Trace','Floor beside the filing cabinet','Logged'],
  ['EX-04','Mobile phone','Digital','Meeting table','Specialist review requested'],
  ['EX-05','USB drive','Digital','Beside the desktop keyboard','Transfer recorded'],
  ['EX-06','Additional glass fragment','Trace','Floor near the doorway','Logged']
];
const requests=[
  ['SR-01','EX-01','Biology','Assess suitability for comparison'],
  ['SR-02','EX-02','Trace evidence','Assess suitability for fibre comparison'],
  ['SR-03','EX-04','Digital evidence','Advise on examination requirements']
];
const nav=document.querySelector('#nav'), screen=document.querySelector('#screen'), toggle=document.querySelector('#samples');
const detail=document.querySelector('#detail');
let page=0, loaded=false, filter='All';
document.querySelector('#detail').setAttribute('aria-labelledby','detail-title');
nav.innerHTML=names.map((name,i)=>`<button data-page="${i}">${name}</button>`).join('');
const field=(label,value)=>`<div><dt>${label}</dt><dd>${value}</dd></div>`;
const pill=text=>`<span class="pill">${text}</span>`;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;
const table=(caption,head,rows)=>`<div class="record"><table><caption>${caption}</caption><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const empty=(title,copy)=>`<section class="card empty"><h2>${title}</h2><p class="muted">${copy}</p></section>`;
const link=id=>`<button class="btn" data-exhibit="${id}" aria-label="View exhibit ${id}">${id}</button>`;
const samplePrompt='Use “Load sample records” to see a completed example.';
const views=[
  ()=>`<section class="hero"><div class="case-id">TR-2026-014 · FICTIONAL TRAINING CASE</div><h2>Office theft and assault</h2><p>An employee reports an assault and a missing laptop at an administrative office. The exercise begins after the scene has been secured. The two-person team must document what they find and account for each exhibit through handover.</p></section>
  <div class="grid">${card('Scene brief','<dl>'+field('Location','Administrative office, Room 204')+field('Exercise starting point','Initial scene assessment')+'</dl>')}
  ${card('Learner roles','<dl>'+field('Learner A','Scene documentation and exhibit recording')+field('Learner B','Exhibit tracking and handover documentation')+'</dl>')}</div>
  <div class="toolbar"><button class="btn primary" data-page="1">Review recording equipment</button><button class="btn" data-page="2">Open evidence register</button></div>`,
  ()=>`<div class="grid three">${[
    ['Scene camera','Photograph the scene and record image references against exhibits.'],
    ['Scene notes and sketch','Document initial observations and exhibit locations.'],
    ['Exhibit labels and tracking','Assign a unique reference and use it across the register and transfer record.'],
    ['PPE selection','Discuss suitable protective equipment and how the team would prevent contamination.'],
    ['Packaging and preservation','Discuss the packaging, labelling, and preservation decisions for each exhibit.'],
    ['Transfer documentation','Prepare a custody record for the subsequent handover.']
  ].map(([title,desc])=>card(title,`<p class="muted">${desc}</p>`)).join('')}</div><button class="btn primary" data-page="2">Open evidence register</button>`,
  ()=>loaded?`<div class="toolbar" aria-label="Filter by exhibit type">${['All','Biological','Trace','Digital'].map(type=>`<button class="btn" data-filter="${type}" aria-pressed="${type===filter}">${type}</button>`).join('')}</div>`+
    table('Exhibits',['Reference','Description','Type','Status'],items.filter(item=>filter==='All'||item[2]===filter).map(([id,title,type,,status])=>[link(id),title,type,pill(status)])):
    empty('No exhibits recorded',samplePrompt),
  ()=>loaded?table('Specialist requests',['Request','Exhibit','Specialism','Question','Status'],requests.map(([id,exhibit,type,question])=>[id,link(exhibit),type,question,pill('Requested')])):empty('No specialist requests',samplePrompt),
  ()=>loaded?table('Chain of custody',['Transfer','Exhibit','Released by','Received by','Case time','Status'],[['TX-01',link('EX-05'),'Learner B','Evidence intake','10:42',pill('Received')]]):empty('No transfers recorded',samplePrompt),
  ()=>`<div class="grid three">${[[2,'Exhibits',6],[3,'Specialist requests',3],[4,'Transfers',1]].map(([target,title,count])=>card(title,`<p><strong>${loaded?count:0}</strong> recorded</p><button class="btn" data-page="${target}">Review ${title.toLowerCase()}</button>`)).join('')}</div>`+
    card('Trainer discussion','<ul><li>Can the learner link their notes and scene photographs to each exhibit?</li><li>Can they explain their choices about packaging, labelling, and preservation?</li><li>Can they account for who held an exhibit and when it went into storage?</li></ul>')
];
function render(){
  nav.querySelectorAll('button').forEach((button,index)=>{
    if(index===page)button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  toggle.textContent=loaded?'Reset demo':'Load sample records';
  screen.innerHTML=`<div class="intro"><h1>${names[page]}</h1><p class="muted">${descriptions[page]}</p></div>`+views[page]();
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button)return;
  if(button===toggle){
    loaded=!loaded;
    filter='All';
    render();
  }else if('page' in button.dataset){
    page=Number(button.dataset.page);
    render();
    screen.focus();
  }else if('filter' in button.dataset){
    filter=button.dataset.filter;
    render();
    screen.querySelector('[aria-pressed=true]').focus();
  }else if('exhibit' in button.dataset){
    const [id,title,type,location,status]=items.find(item=>item[0]===button.dataset.exhibit);
    document.querySelector('#detail-title').textContent=title;
    document.querySelector('#detail-body').innerHTML=field('Exhibit reference',id)+field('Evidence type',type)+field('Location recorded',location)+field('Status',status);
    detail.showModal();
  }
});
render();
</script>
</body>
</html>
